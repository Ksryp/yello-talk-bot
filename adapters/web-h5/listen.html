<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ฟังเพลงจากบอท</title>
  <style>
    :root { --bg: #fffbea; --card: #ffffff; --ink: #1f1a0e; --muted: #6b6250; --accent: #f5b800; --accent-ink: #1f1a0e; --line: #eadfbd; --bad: #b42318; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #17140c; --card: #221e13; --ink: #f6efd9; --muted: #b3a88b; --accent: #f5b800; --accent-ink: #17140c; --line: #3a3322; --bad: #ff8a80; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", "Noto Sans Thai", sans-serif; }
    main { width: 100%; max-width: 420px; background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 28px 24px; text-align: center; }
    .eyebrow { margin: 0; font-size: 12px; letter-spacing: .12em; color: var(--muted); }
    h1 { margin: 4px 0 20px; font-size: 24px; }
    button { width: 100%; border: 0; border-radius: 999px; padding: 14px 20px; font: inherit; font-weight: 700; cursor: pointer; background: var(--accent); color: var(--accent-ink); }
    button.secondary { background: transparent; color: var(--ink); border: 1px solid var(--line); }
    button:disabled { opacity: .5; cursor: default; }
    #status { margin: 16px 0 0; min-height: 1.5em; color: var(--muted); }
    #status.error { color: var(--bad); }
    .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--line); margin-right: 6px; vertical-align: middle; }
    .dot.live { background: #2fb344; box-shadow: 0 0 0 4px rgba(47,179,68,.18); }
    label { display: flex; align-items: center; gap: 12px; margin-top: 20px; color: var(--muted); font-size: 14px; }
    input[type=range] { flex: 1; accent-color: var(--accent); }
    .hint { margin-top: 20px; font-size: 13px; color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">YELLO MUSIC BOT</p>
    <h1>ฟังเพลงจากบอท</h1>
    <button id="toggle">เริ่มฟัง</button>
    <p id="status"><span class="dot" id="dot"></span><span id="statusText">ยังไม่ได้เชื่อมต่อ</span></p>
    <label>เสียง <input id="volume" type="range" min="0" max="100" value="100"></label>
    <p class="hint">เปิดหน้านี้คู่กับแอป YelloTalk ได้เลย — หน้านี้รับฟังอย่างเดียว ไม่ใช้ไมค์ของคุณ</p>
  </main>
  <!-- The GME H5 SDK renders remote audio elements into this wrapper. -->
  <div id="gme-audio-wrap" hidden></div>

  <script>
    // Never hand the SDK a real microphone: listeners are receive-only.
    const realGetUserMedia = navigator.mediaDevices && navigator.mediaDevices.getUserMedia
      ? navigator.mediaDevices.getUserMedia.bind(navigator.mediaDevices) : null;
    if (navigator.mediaDevices) {
      navigator.mediaDevices.getUserMedia = async (constraints) => {
        if (constraints && constraints.audio) {
          const ctx = new AudioContext();
          return ctx.createMediaStreamDestination().stream;
        }
        return realGetUserMedia ? realGetUserMedia(constraints) : Promise.reject(new Error('unavailable'));
      };
    }
  </script>
  <script src="/listen/sdk.js"></script>
  <script>
    const EVENT = { ENTER_ROOM: 1, EXIT_ROOM: 2, ROOM_DISCONNECT: 3 };
    const ROOM_TYPE_HQ = 3;
    const ENTER_TIMEOUT_MS = 15000;
    const ENTER_ATTEMPTS = 3;

    const toggle = document.getElementById('toggle');
    const statusEl = document.getElementById('status');
    const statusText = document.getElementById('statusText');
    const dot = document.getElementById('dot');
    const volume = document.getElementById('volume');

    let gme = null;
    let listening = false;
    let wantListening = false;
    let pendingEnter = null;

    function setStatus(text, { live = false, error = false } = {}) {
      statusText.textContent = text;
      dot.className = live ? 'dot live' : 'dot';
      statusEl.className = error ? 'error' : '';
    }

    function onEvent(type, result) {
      const code = result && (result.errorCode !== undefined ? result.errorCode : result.result);
      if (type === EVENT.ENTER_ROOM && pendingEnter) {
        const { resolve, reject } = pendingEnter;
        pendingEnter = null;
        code === 0 ? resolve() : reject(new Error('EnterRoom ' + JSON.stringify(result)));
      } else if (type === EVENT.ROOM_DISCONNECT || (type === EVENT.EXIT_ROOM && wantListening)) {
        listening = false;
        if (wantListening) { setStatus('หลุดการเชื่อมต่อ กำลังเชื่อมใหม่…'); setTimeout(() => { if (wantListening) void start(); }, 2000); }
      }
    }

    function applyVolume() {
      document.querySelectorAll('#gme-audio-wrap audio, audio').forEach(el => { el.volume = Number(volume.value) / 100; });
    }

    async function fetchTicket() {
      const response = await fetch('/listen/ticket', { cache: 'no-store' });
      const body = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(body.error || 'ขอสิทธิ์ฟังไม่สำเร็จ');
      return body;
    }

    function enterOnce(roomId, authBuffer) {
      return new Promise((resolve, reject) => {
        const timer = setTimeout(() => { pendingEnter = null; reject(new Error('timeout')); }, ENTER_TIMEOUT_MS);
        pendingEnter = { resolve: () => { clearTimeout(timer); resolve(); }, reject: (e) => { clearTimeout(timer); reject(e); } };
        gme.EnterRoom(String(roomId), ROOM_TYPE_HQ, authBuffer);
      });
    }

    async function start() {
      if (typeof WebGMEAPI === 'undefined') { setStatus('โหลด GME SDK ไม่สำเร็จ', { error: true }); return; }
      toggle.disabled = true;
      setStatus('กำลังเชื่อมต่อ…');
      try {
        const ticket = await fetchTicket();
        if (!gme) {
          new WebGMEAPI();
          gme = WebGMEAPI.fn;
          gme.SetTMGDelegate(onEvent);
        }
        gme.Init(document, Number(ticket.appId), String(ticket.openId));
        await new Promise(r => setTimeout(r, 300));
        let lastError = null;
        for (let attempt = 1; attempt <= ENTER_ATTEMPTS && wantListening; attempt++) {
          try { await enterOnce(ticket.roomId, ticket.authBuffer); lastError = null; break; }
          catch (e) { lastError = e; try { gme.ExitRoom(); } catch (_) {} await new Promise(r => setTimeout(r, 700)); }
        }
        if (!wantListening) return;
        if (lastError) throw new Error('เข้าห้องเสียงไม่สำเร็จ');
        try { gme.EnableMic(false); } catch (_) {}
        try { gme.EnableSpeaker(true); } catch (_) {}
        // Browsers may block autoplay of remote audio; this follows the click.
        try { gme.resumeAllRemoteStreams(); } catch (_) {}
        applyVolume();
        listening = true;
        setStatus(ticket.playing ? 'กำลังฟังอยู่' : 'เชื่อมต่อแล้ว — รอบอทเปิดเพลง', { live: true });
      } catch (e) {
        wantListening = false;
        setStatus(e.message || 'เชื่อมต่อไม่สำเร็จ', { error: true });
      } finally {
        toggle.disabled = false;
        toggle.textContent = wantListening ? 'หยุดฟัง' : 'เริ่มฟัง';
        toggle.className = wantListening ? 'secondary' : '';
      }
    }

    function stop() {
      wantListening = false;
      listening = false;
      try { gme && gme.ExitRoom(); } catch (_) {}
      setStatus('หยุดฟังแล้ว');
      toggle.textContent = 'เริ่มฟัง';
      toggle.className = '';
    }

    toggle.addEventListener('click', () => {
      if (wantListening) return stop();
      wantListening = true;
      toggle.textContent = 'หยุดฟัง';
      void start();
    });
    volume.addEventListener('input', applyVolume);
    window.addEventListener('pagehide', () => { try { gme && gme.ExitRoom(); } catch (_) {} });
  </script>
</body>
</html>
